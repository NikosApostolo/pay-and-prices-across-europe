name: Refresh and publish dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '37 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate the full Eurostat history
        run: npm run refresh
      - run: npm test
      - name: Cross-check all values against Eurostat’s TSV export
        run: node scripts/audit-data.mjs
      - name: Save the validated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Eurostat data snapshot'
            git push origin HEAD:main
          fi
      - name: Prepare public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Record an unsuccessful refresh or build
        if: failure()
        run: echo "::error::Dashboard preparation failed. The last deployed snapshot is still available."

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
